<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Heard</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Rail tokens and components -->
  <link rel="stylesheet" href="rail/tokens.css">
  <link rel="stylesheet" href="rail/components/Button.css">
  <link rel="stylesheet" href="rail/components/Input.css">
  <link rel="stylesheet" href="rail/components/Stepper.css">
  <link rel="stylesheet" href="rail/components/Select.css">
  <link rel="stylesheet" href="rail/components/Checkbox.css">
  <link rel="stylesheet" href="rail/components/Switch.css">
  <link rel="stylesheet" href="rail/components/Badge.css">
  <link rel="stylesheet" href="rail/components/Card.css">
  <link rel="stylesheet" href="rail/components/ListRow.css">
  <link rel="stylesheet" href="rail/components/Dialog.css">
  <link rel="stylesheet" href="rail/components/Toast.css">
  <link rel="stylesheet" href="rail/components/Tabs.css">
  <link rel="stylesheet" href="rail/components/Logo.css">
  <link rel="stylesheet" href="rail/utilities/reset.css">
  <link rel="stylesheet" href="rail/layouts/page.css">

  <!-- Page-specific styles -->
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="app" class="density-comfortable env-standard">
    <div class="login-shell">

      <!-- Brand panel (desktop only) -->
      <aside class="login-brand">
        <img class="login-brand__image" src="https://images.pexels.com/photos/35833817/pexels-photo-35833817.jpeg?auto=compress&cs=tinysrgb&w=1600" alt="" />
        <div class="login-brand__overlay"></div>
        <div class="login-brand__content">
          <svg class="rail-logo rail-logo--on-image" width="137" height="48" viewBox="0 0 137 48" role="img" aria-label="Heard">
            <g transform="translate(10, 4.445)"><path class="rail-logo__mark" d="M24 1.90527 L10.2393 27.8125 L4.26074 21.834 L1.0791 25.0156 L11.3604 35.2969 L24 11.5 L24 37.5547 L0 37.5547 L0 1.55469 L2.40039 4.55469 L4.7998 1.55469 L7.2002 5.55469 L9.59961 1.55469 L12 4.05469 L14.4004 1.55469 L16.7998 5.05469 L19.2002 1.55469 L21.5996 4.55469 L24 1.55469 L24 1.90527 Z M28.9873 2.10938 L25.9873 7.75977 L22.0127 5.64941 L25.0127 0 L28.9873 2.10938 Z"/></g>
            <text class="rail-logo__wordmark" x="45" y="42">HEARD</text>
          </svg>
          <div class="login-brand__text">
            <p class="login-brand__tagline">Every order, heard.</p>
            <p class="login-brand__sub">Order from 1,400+ restaurants nationwide.</p>
          </div>
        </div>
      </aside>

      <!-- Form panel -->
      <main class="login-form-panel">
        <div class="login-form-panel__inner">

          <!-- Mobile logo (hidden on desktop where brand panel shows it) -->
          <div class="login-form-panel__logo">
            <svg class="rail-logo" width="137" height="48" viewBox="0 0 137 48" role="img" aria-label="Heard">
              <g transform="translate(10, 4.445)"><path class="rail-logo__mark" d="M24 1.90527 L10.2393 27.8125 L4.26074 21.834 L1.0791 25.0156 L11.3604 35.2969 L24 11.5 L24 37.5547 L0 37.5547 L0 1.55469 L2.40039 4.55469 L4.7998 1.55469 L7.2002 5.55469 L9.59961 1.55469 L12 4.05469 L14.4004 1.55469 L16.7998 5.05469 L19.2002 1.55469 L21.5996 4.55469 L24 1.55469 L24 1.90527 Z M28.9873 2.10938 L25.9873 7.75977 L22.0127 5.64941 L25.0127 0 L28.9873 2.10938 Z"/></g>
              <text class="rail-logo__wordmark" x="45" y="42">HEARD</text>
            </svg>
          </div>

          <!-- Heading -->
          <div class="login-form-panel__heading">
            <h1 class="type-display">Welcome back</h1>
            <p class="type-body login-form-panel__subtitle">Sign in to your account</p>
          </div>

          <!-- Form -->
          <form class="form-layout login-form" id="login-form" novalidate>

            <!-- Email -->
            <div class="rail-input" id="email-field">
              <label class="rail-input__label" for="email">Email</label>
              <input class="rail-input__field" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
            </div>

            <!-- Password with visibility toggle -->
            <div class="rail-input login-password" id="password-field">
              <label class="rail-input__label" for="password">Password</label>
              <div class="login-password__wrapper">
                <input class="rail-input__field" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
                <button class="login-password__toggle" type="button" aria-label="Show password" aria-pressed="false" id="password-toggle">
                  <i data-lucide="eye" class="login-password__icon login-password__icon--show"></i>
                  <i data-lucide="eye-off" class="login-password__icon login-password__icon--hide"></i>
                </button>
              </div>
            </div>

            <!-- Remember + Forgot row -->
            <div class="login-form__options">
              <label class="rail-checkbox">
                <input class="rail-checkbox__input" type="checkbox" id="remember" name="remember" />
                <span class="rail-checkbox__box" aria-hidden="true"></span>
                <span class="rail-checkbox__label">Remember me</span>
              </label>
              <a href="#" class="login-form__forgot">Forgot password?</a>
            </div>

            <!-- Submit -->
            <button class="rail-button rail-button--primary rail-button--full-width" type="submit" id="submit-btn">
              Sign in
            </button>

            <!-- Sign up -->
            <p class="login-form__signup type-body">
              New to Heard? <a href="#">Create an account</a>
            </p>
          </form>
        </div>
      </main>
    </div>

    <!-- Toast region -->
    <div class="rail-toast-region" role="status" aria-live="polite" aria-label="Notifications" id="toast-region"></div>
  </div>

  <script src="login.js"></script>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
